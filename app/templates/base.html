<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_title }}{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        biNavy: '#003366',
                        deepBlue: '#0A192F',
                        prestigeGold: '#D4AF37',
                        glowGold: '#FADB5F',
                        cleanSlate: '#F8FAFC',
                        surfaceWhite: '#FFFFFF',
                        slateInk: '#1E293B',
                        dangerCrimson: '#EF4444',
                        validGreen: '#10B981'
                    },
                    boxShadow: {
                        command: '0 20px 60px rgba(10,25,47,0.16)',
                        glow: '0 0 0 1px rgba(212,175,55,0.18), 0 10px 30px rgba(212,175,55,0.18)',
                        danger: '0 0 20px rgba(239,68,68,0.35)'
                    },
                    animation: {
                        shimmer: 'shimmer 1.8s linear infinite',
                        pulseDanger: 'pulseDanger 1.2s ease-in-out infinite',
                        scan: 'scan 1.4s ease-in-out infinite',
                        slideUp: 'slideUp 0.45s ease-out forwards'
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        },
                        pulseDanger: {
                            '0%, 100%': { boxShadow: '0 0 0 rgba(239,68,68,0.15)' },
                            '50%': { boxShadow: '0 0 26px rgba(239,68,68,0.55)' }
                        },
                        scan: {
                            '0%': { transform: 'translateY(-120%)', opacity: '0' },
                            '50%': { opacity: '1' },
                            '100%': { transform: 'translateY(520%)', opacity: '0' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(12px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script>
        window.SAKSI_SOCKET_IO_SOURCES = [
            '/socket.io/socket.io.js',
            'https://cdn.socket.io/4.7.5/socket.io.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js'
        ];
    </script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-cleanSlate text-slateInk min-h-screen" data-page="{{ active_page|default('') }}">
    <div id="sidebar-backdrop" class="pointer-events-none fixed inset-0 z-30 bg-slateInk/55 opacity-0 transition duration-300 lg:hidden" aria-hidden="true"></div>
    <div class="flex min-h-screen">
        {% include 'partials/sidebar.html' %}
        <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/90 backdrop-blur-xl">
                <div class="flex items-center gap-4 px-6 py-4 lg:px-8">
                    <button id="sidebar-toggle" type="button" aria-controls="app-sidebar" aria-expanded="false" aria-label="Buka navigasi" class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-biNavy transition hover:border-prestigeGold hover:text-prestigeGold lg:hidden">
                        ☰
                    </button>
                    <div class="flex items-center gap-3">
                        <div class="flex h-11 w-11 items-center justify-center overflow-hidden rounded-2xl bg-white shadow-command ring-1 ring-slate-200">
                            <img src="{{ url_for('static', filename='Logo Saksi.png') }}" alt="Logo SAKSI" class="h-full w-full object-contain p-1">
                        </div>
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-[0.28em] text-prestigeGold">SAKSI KPSP</p>
                            <p class="text-sm text-slate-500">Sistem Asistensi untuK Saksi Ahli</p>
                        </div>
                    </div>
                    <div class="relative hidden flex-1 xl:block">
                        <input id="global-search" type="text" placeholder="🔍 Cari histori BAP, PBI, atau modul sertifikasi..." class="w-full rounded-2xl border border-slate-200 bg-cleanSlate px-5 py-3 text-sm outline-none transition focus:border-prestigeGold focus:ring-4 focus:ring-prestigeGold/10">
                        <div id="search-results" class="absolute left-0 right-0 mt-2 hidden overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-command"></div>
                    </div>
                    <div class="ml-auto flex items-center gap-3 lg:gap-4">
                        <div class="hidden items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-4 py-2 text-xs font-semibold text-validGreen md:flex">
                            <span class="inline-flex h-2.5 w-2.5 rounded-full bg-validGreen animate-pulse"></span>
                            {{ engine_label }}
                        </div>
                        <button class="relative inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-biNavy transition hover:border-prestigeGold hover:text-prestigeGold">
                            🔔
                            <span class="absolute right-3 top-3 h-2.5 w-2.5 rounded-full bg-dangerCrimson"></span>
                        </button>
                        <div class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-3 py-2 shadow-sm">
                            <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-biNavy to-deepBlue text-sm font-bold text-white">RP</div>
                            <div class="hidden sm:block">
                                <p class="text-sm font-semibold text-slateInk">{{ profile_name }}</p>
                                <p class="text-xs text-prestigeGold">{{ profile_badge }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            <main class="flex-1 px-6 py-6 lg:px-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
